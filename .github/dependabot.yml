version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    target-branch: "dev"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"

    open-pull-requests-limit: 3

    commit-message:
      prefix: "deps(ui)"

    groups:
      ui-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Chicago"

    open-pull-requests-limit: 2

    commit-message:
      prefix: "deps(actions)"

    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
