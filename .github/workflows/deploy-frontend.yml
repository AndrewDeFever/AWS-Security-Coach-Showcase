name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths:
      - "ui/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref_name == 'dev' || github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend deployment variables
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_AUTHORITY: ${{ vars.VITE_COGNITO_AUTHORITY }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI }}
          VITE_COGNITO_LOGOUT_URI: ${{ vars.VITE_COGNITO_LOGOUT_URI }}
        run: |
          for variable_name in \
            VITE_API_BASE_URL \
            VITE_COGNITO_DOMAIN \
            VITE_COGNITO_AUTHORITY \
            VITE_COGNITO_CLIENT_ID \
            VITE_COGNITO_REDIRECT_URI \
            VITE_COGNITO_LOGOUT_URI
          do
            test -n "${!variable_name}" || {
              echo "$variable_name is required for frontend builds."
              exit 1
            }
          done

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_AUTHORITY: ${{ vars.VITE_COGNITO_AUTHORITY }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI }}
          VITE_COGNITO_LOGOUT_URI: ${{ vars.VITE_COGNITO_LOGOUT_URI }}

      - name: Reject sensitive values in frontend bundle
        shell: bash
        run: |
          set -euo pipefail

          frontend_secret_var="VITE_SHARED_""SECRET"
          if grep -RIn --fixed-strings "$frontend_secret_var" dist; then
            echo "Frontend bundle contains a retired secret variable reference."
            exit 1
          fi

          if grep -RInE "[0-9]{12}" dist; then
            echo "Frontend bundle contains a hard-coded 12-digit account identifier."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync frontend to S3
        run: aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
