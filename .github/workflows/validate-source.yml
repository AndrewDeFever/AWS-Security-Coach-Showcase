name: Validate Source

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: validate-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      connector: ${{ steps.changes.outputs.connector }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine validation scope
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          frontend=false
          backend=false
          connector=false

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            frontend=true
            backend=true
            connector=true
          else
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                .github/workflows/validate-source.yml)
                  frontend=true
                  backend=true
                  connector=true
                  ;;
                ui/*|.github/workflows/deploy-frontend.yml)
                  frontend=true
                  ;;
                backend/*|.github/workflows/deploy-backend.yml)
                  backend=true
                  ;;
                connector/*|.github/workflows/connector-release-immutability.yml|.github/workflows/publish-connector-release.yml)
                  connector=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "connector=$connector" >> "$GITHUB_OUTPUT"
          printf 'Validation scope: frontend=%s backend=%s connector=%s\n' "$frontend" "$backend" "$connector"

      - name: Reject retired infrastructure identifiers
        shell: bash
        run: |
          set -euo pipefail

          legacy_api_id="s58""xd5cbqi"
          legacy_bucket="techin77-safety-coach-artifacts-""123456"
          legacy_table="aws-safety-coach-""scans"
          legacy_runner="aws-safety-coach-""runner"

          for identifier in \
            "$legacy_api_id" \
            "$legacy_bucket" \
            "$legacy_table" \
            "$legacy_runner"
          do
            if grep -RIn --exclude-dir=.git --fixed-strings "$identifier" .; then
              echo "Retired infrastructure identifier found: $identifier"
              exit 1
            fi
          done

      - name: Reject frontend-embedded secrets and account identifiers
        shell: bash
        run: |
          set -euo pipefail

          frontend_secret_var="VITE_SHARED_""SECRET"
          if grep -RIn --fixed-strings "$frontend_secret_var" ui/src .github/workflows/deploy-frontend.yml; then
            echo "Frontend source must not embed or build with a shared secret."
            exit 1
          fi

          if grep -RInE "[0-9]{12}" ui/src; then
            echo "Frontend source contains a hard-coded 12-digit account identifier."
            exit 1
          fi

  frontend-build:
    needs: source-gate
    if: ${{ needs.source-gate.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://example.invalid
        run: npm run build

      - name: Verify sanitized frontend bundle
        shell: bash
        run: |
          set -euo pipefail

          frontend_secret_var="VITE_SHARED_""SECRET"
          if grep -RInE "[0-9]{12}|${frontend_secret_var}" dist; then
            echo "Frontend bundle contains a hard-coded account identifier or secret reference."
            exit 1
          fi

  backend-validation:
    needs: source-gate
    if: ${{ needs.source-gate.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check boto3

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Validate SAM template
        run: sam validate --lint --template-file template.yaml

  connector-template:
    needs: source-gate
    if: ${{ needs.source-gate.outputs.connector == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install connector verifier dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Verify connector CloudFormation package
        run: bash connector/verify-template.sh

  validation-complete:
    name: Validation Complete
    if: ${{ always() }}
    needs:
      - source-gate
      - frontend-build
      - backend-validation
      - connector-template
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm validation outcomes
        shell: bash
        env:
          SOURCE_GATE_RESULT: ${{ needs.source-gate.result }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          BACKEND_RESULT: ${{ needs.backend-validation.result }}
          CONNECTOR_RESULT: ${{ needs.connector-template.result }}
        run: |
          set -euo pipefail

          test "$SOURCE_GATE_RESULT" = "success" || {
            echo "Source gate result: $SOURCE_GATE_RESULT"
            exit 1
          }

          for result in "$FRONTEND_RESULT" "$BACKEND_RESULT" "$CONNECTOR_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "Validation job result was not acceptable: $result"
                exit 1
                ;;
            esac
          done

          printf 'Validation complete: source=%s frontend=%s backend=%s connector=%s\n' \
            "$SOURCE_GATE_RESULT" \
            "$FRONTEND_RESULT" \
            "$BACKEND_RESULT" \
            "$CONNECTOR_RESULT"

